name: Generate CHANGELOG.md

on:
  workflow_dispatch:
    inputs:
      max_entries:
        description: Number of most recent releases to include
        type: number
        default: 80

jobs:
  changelog:
    name: Generate CHANGELOG.md
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Generate CHANGELOG.md
        run: |
          ./generate-changelog.sh
        env:
          TZ: America/Los_Angeles
          CHANGELOG_MAX_ENTRIES: ${{ inputs.max_entries }}
      - name: Set Git Authors
        run: |
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}
          git config user.email brgmnn@users.noreply.github.com
          git config user.name "Daniel Bergmann"
      - name: Commit CHANGELOG
        run: |
          git add CHANGELOG.md
          git commit -m "Update CHANGELOG.md"
          git push origin main
